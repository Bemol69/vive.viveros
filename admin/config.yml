# Configuración del panel /admin (Sveltia CMS)
# Cada cambio que se guarda aquí crea un commit en GitHub.
# Vercel arma la web (scripts/build.mjs) y la publica en ~1 minuto.
# Este archivo pasa por el build: %%CATEGORIAS_YAML%% sale de data/categorias.json.

backend:
  name: github
  repo: %%GITHUB_REPO%%
  branch: main
  commit_messages:
    create: "Web: crea {{collection}} «{{slug}}»"
    update: "Web: actualiza {{collection}} «{{slug}}»"
    delete: "Web: elimina {{collection}} «{{slug}}»"
    uploadMedia: "Web: sube foto {{path}}"
    deleteMedia: "Web: elimina foto {{path}}"

site_url: %%SITE_URL%%
display_url: %%SITE_URL%%
logo_url: ../img/favicon.svg

media_folder: img/productos
public_folder: /img/productos

# Nombres de archivo sin tildes ni ñ (ej: "Jazmín del Cabo" -> jazmin-del-cabo.json)
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Las fotos del celular se achican y convierten a WebP al subirlas, para que la web cargue rápido
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1200
          height: 1200

collections:
  # ---------- PRODUCTOS (todo el catálogo) ----------
  - name: productos
    label: Productos
    label_singular: producto
    description: "Todo el catálogo. Para cambiar un precio: búscalo, cámbialo y toca Guardar. Si se acaba, marca «Agotado» (no lo borres). La web se actualiza sola en 1 minuto."
    icon: potted_plant
    folder: data/productos
    format: json
    create: true
    delete: true
    identifier_field: nombre
    slug: "{{nombre}}"
    summary: "{{nombre}} · ${{precio}}{{agotado | ternary(' · AGOTADO', '')}}"
    thumbnail: portada
    sortable_fields:
      fields: [nombre, precio, categoria, orden]
      default:
        field: nombre
        direction: ascending
    view_filters:
      - { label: "Agotados", field: agotado, pattern: true }
      - { label: "En la página principal", field: inicio, pattern: true }
      - { label: "Con precio por mayor", field: precio_mayor, pattern: '\d' }
      - { label: "Ocultos de la web", field: visible, pattern: false }
    view_groups:
      - { label: Categoría, field: categoria }
    fields:
      # Lo de todos los días
      - name: nombre
        label: Nombre
        hint: "Como lo conoce la gente. Ej: Limonero Eureka"
        widget: string
      - name: precio
        label: Precio (en pesos)
        hint: "Solo números, sin puntos ni $. Ej: 8000. Vacío = «Consultar precio»."
        widget: number
        value_type: int
        min: 0
        required: false
      - name: categoria
        label: Categoría
        hint: "Para agregar o renombrar categorías, ve a «Categorías» (aparecen aquí 1 minuto después de guardar)."
        widget: select
        options: %%CATEGORIAS_YAML%%
      - name: portada
        label: Foto
        hint: "Cuadrada o vertical, con el producto al centro y buena luz. Se achica sola al subirla."
        widget: image
        required: false
      - name: agotado
        label: ¿Agotado?
        hint: "Sigue apareciendo en el catálogo, pero no se puede pedir y ofrece «Avísame cuando llegue»."
        widget: boolean
        default: false
        required: false
      # Opcional
      - name: precio_mayor
        label: "Precio por mayor (opcional)"
        hint: "Se usa cuando el cliente elige «Por mayor» en el pedido. Debe ser menor que el precio normal."
        widget: number
        value_type: int
        min: 0
        required: false
      - name: descripcion
        label: "Descripción (opcional)"
        hint: "Una o dos frases: qué es, tamaño o maceta. Ej: Maceta N°17, aprox. 60 cm de alto."
        widget: text
        required: false
      - name: luz
        label: "Cuidados: luz (opcional)"
        hint: "Ej: Pleno sol / Luz indirecta, sin sol directo"
        widget: string
        required: false
      - name: riego
        label: "Cuidados: riego (opcional)"
        hint: "Ej: Dejar secar el sustrato entre riegos"
        widget: string
        required: false
      - name: etiqueta
        label: "Cinta sobre la foto (opcional)"
        hint: "Corta. Ej: Oferta, Recién llegada, Nativo, Pocas unidades"
        widget: string
        required: false
      - name: fotos
        label: "Más fotos (opcional)"
        hint: "Se ven al abrir el producto. Hasta 4 se ve bien."
        widget: list
        required: false
        field: { name: foto, label: Foto, widget: image }
      - name: inicio
        label: ¿Mostrar en la página principal?
        hint: "Las elegidas salen en «Recién llegadas» de la portada. Lo ideal: entre 6 y 10."
        widget: boolean
        default: false
        required: false
      - name: destacado
        label: ¿Destacado en grande?
        hint: "Sale primero y en grande en la portada. Deja solo uno."
        widget: boolean
        default: false
        required: false
      - name: orden
        label: Orden
        hint: "Número más bajo = aparece antes en «Destacados». Ej: 1, 2, 3…"
        widget: number
        value_type: int
        default: 500
        required: false
      - name: visible
        label: ¿Mostrar en la web?
        hint: "Apágalo para esconderlo sin borrarlo (por ejemplo, productos de otra temporada)."
        widget: boolean
        default: true
        required: false

  # ---------- CATEGORÍAS ----------
  - name: categorias
    label: Categorías
    icon: category
    files:
      - name: categorias
        label: Categorías del catálogo
        file: data/categorias.json
        fields:
          - name: categorias
            label: Categorías
            hint: "Arrastra para cambiar el orden en el catálogo. Si renombras una, cambia también la categoría de sus productos."
            widget: list
            summary: "{{fields.nombre}}"
            fields:
              - { name: nombre, label: Nombre, widget: string }

  # ---------- DATOS DEL VIVERO ----------
  - name: ajustes
    label: Datos del vivero
    icon: storefront
    files:
      - name: ajustes
        label: Contacto, horario, pagos y portada
        file: data/ajustes.json
        fields:
          - name: whatsapp
            label: WhatsApp de pedidos
            hint: "Formato internacional, solo números. Ej: 56944068856. Si lo dejas vacío, se ocultan el pedido y los botones de WhatsApp."
            widget: string
            required: false
            pattern: ["^$|^569\\d{8}$", "Debe partir con 569 y tener 11 números, ej: 56944068856"]
          - name: mensaje_whatsapp
            label: Mensaje inicial de WhatsApp
            hint: "Lo que aparece escrito cuando alguien toca «WhatsApp». Ej: Hola Vive Viveros 🌿 Quiero hacer una consulta."
            widget: string
          - name: medios_pago
            label: Medios de pago del pedido
            hint: "Las opciones del paso «Pago» en «Tu pedido». Ej: Transferencia, Efectivo, Débito / Crédito"
            widget: list
            required: false
          - name: pago_online
            label: "¿Activar «Pagar ahora con tarjeta» (Klap)?"
            hint: "Solo enciéndelo cuando el desarrollador confirme que Klap está configurado. Si algo falla, el cliente siempre puede enviar el pedido por WhatsApp."
            widget: boolean
            default: false
            required: false
          - name: instagram
            label: Usuario de Instagram
            hint: "Sin @. Ej: vive.viveros"
            widget: string
            required: false
          - name: email
            label: Correo
            widget: string
            required: false
            pattern: ["^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Escribe un correo válido, ej: viveviveros@gmail.com"]
          - name: direccion
            label: Dirección para Google Maps
            hint: "Como la busca Google. Ej: Vive Viveros, Salsipuedes s/n, Malloa, O'Higgins. Si la dejas vacía, se oculta el mapa."
            widget: string
            required: false
          - name: direccion_texto
            label: Dirección (como se lee en la web)
            hint: "Ej: Salsipuedes s/n, Malloa"
            widget: string
            required: false
          - name: direccion_referencia
            label: Cómo llegar (referencia)
            hint: "Ej: Al final del camino pavimentado"
            widget: string
            required: false
          - name: ciudad
            label: Comuna
            widget: string
          - name: region
            label: Región
            widget: string
            required: false
          - name: zonas
            label: Comunas con despacho
            hint: "Las que aparecen en «Comuna» al pedir despacho. Ej: Malloa, Rengo, San Fernando"
            widget: list
          - name: horario
            label: Horario de atención
            hint: "Un día por fila, de lunes a domingo. Horas en formato 24 h (HH:MM), ej: 10:00. Si cierran a mediodía, usa el segundo tramo."
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: false
            summary: "{{fields.dia}}: {{fields.abre}}–{{fields.cierra}} {{fields.abre2}}–{{fields.cierra2}}"
            fields:
              - { name: dia, label: Día, widget: string, readonly: true }
              - { name: cerrado, label: ¿Cerrado todo el día?, widget: boolean, default: false, required: false }
              - { name: abre, label: Abre, widget: string, required: false, pattern: ["^$|^([01]\\d|2[0-3]):[0-5]\\d$", "Usa HH:MM, ej: 10:00"] }
              - { name: cierra, label: Cierra, widget: string, required: false, pattern: ["^$|^([01]\\d|2[0-3]):[0-5]\\d$", "Usa HH:MM, ej: 13:00"] }
              - { name: abre2, label: "Vuelve a abrir (opcional)", widget: string, required: false, pattern: ["^$|^([01]\\d|2[0-3]):[0-5]\\d$", "Usa HH:MM, ej: 14:00"] }
              - { name: cierra2, label: "Cierra (segundo tramo)", widget: string, required: false, pattern: ["^$|^([01]\\d|2[0-3]):[0-5]\\d$", "Usa HH:MM, ej: 18:30"] }
          - name: hero_eyebrow
            label: "Portada: texto de arriba"
            hint: "Ej: Vivero en Salsipuedes · Malloa"
            widget: string
          - name: hero_titulo
            label: "Portada: título"
            hint: "Ej: Frutales, ornamentales y"
            widget: string
          - name: hero_destacado
            label: "Portada: palabra en verde (subrayada)"
            hint: "Ej: nativos"
            widget: string
          - name: hero_bajada
            label: "Portada: texto"
            widget: text
          - name: hero_foto
            label: "Portada: foto"
            hint: "Vertical, del vivero o de una planta de temporada."
            widget: image
          - name: hero_foto_nota
            label: "Portada: etiqueta de la foto"
            hint: "Se ve como etiqueta escrita a mano. Ej: Crisantemos maules · de temporada. Vacío = sin etiqueta."
            widget: string
            required: false
          - name: sag
            label: ¿Mostrar sello «Vivero autorizado SAG»?
            widget: boolean
            default: true
            required: false
          - name: mayorista
            label: Texto de precios por mayor
            hint: "Vacío = no se muestra. Ej: ¿Tienes vivero o florería? Tenemos precios especiales por cantidad."
            widget: text
            required: false

      - name: flyer
        label: Promoción (flyer)
        file: data/flyer.json
        media_folder: /img/flyer
        public_folder: /img/flyer
        fields:
          - { name: mostrar, label: ¿Mostrar la promoción?, widget: boolean, default: false, required: false }
          - { name: popup, label: "¿Abrirla sola al entrar? (una vez por visita)", widget: boolean, default: false, required: false }
          - { name: imagen, label: Imagen del flyer, widget: image, required: false, hint: "La misma imagen que publicas en Instagram." }
          - { name: titulo, label: Título, widget: string, required: false, hint: "Ej: Semana del limonero" }
          - { name: texto, label: Texto, widget: text, required: false, hint: "Ej: Limoneros a $7.000 hasta el domingo." }
          - { name: mensaje_whatsapp, label: Mensaje de WhatsApp, widget: string, required: false, hint: "Ej: Hola! Quiero la promo de limoneros 🍋" }

      - name: testimonios
        label: Opiniones de clientes
        file: data/testimonios.json
        fields:
          - name: testimonios
            label: Opiniones
            hint: "Copia opiniones reales (WhatsApp, Google, Instagram) con permiso del cliente. La sección aparece cuando hay al menos una."
            widget: list
            required: false
            fields:
              - { name: texto, label: Opinión, widget: text }
              - { name: nombre, label: Nombre del cliente, widget: string, hint: "Ej: Carolina P." }
              - { name: detalle, label: Qué compró y comuna, widget: string, required: false, hint: "Ej: Paltos · Rengo" }
